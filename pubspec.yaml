name: pairbloom
description: An offline-first couples companion powered by SQLite.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  sqflite: ^2.4.2
  path: ^1.9.1
  intl: ^0.20.2
  shared_preferences: ^2.5.3
  flutter_local_notifications: ^22.3.3
  image_picker: ^1.2.3
  path_provider: ^2.1.6
  provider: ^6.1.5+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
