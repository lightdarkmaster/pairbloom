name: pairbloom
description: An offline-first couples companion powered by SQLite.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.6.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  sqflite: ^2.4.2
  path: ^1.9.1
  intl: ^0.20.2
  flutter_local_notifications: ^22.3.3
  image_picker: ^1.2.3
  path_provider: ^2.1.6
  provider: ^6.1.5+1
  flutter_secure_storage: ^9.2.2
  local_auth: ^2.3.0
  encrypt: ^5.0.3
  crypto: ^3.0.3
  geolocator: ^14.0.1
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true